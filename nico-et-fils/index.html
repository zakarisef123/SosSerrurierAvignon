    <!-- 3. Suivi des conversions : clics sur les boutons d'appel + formulaire -->
    <script>
        (function () {
            /* Google Ads : coller ici l'étiquette de conversion "Appel" (ex. 'AW-123456789/AbCdEfGhIjKlMn').
               Laisser vide si la conversion est configurée dans GTM (déclencheur "clic_appel"). */
            var ADS_CONVERSION_APPEL = '';
            var ADS_CONVERSION_FORMULAIRE = '';
            var VALEUR_CONVERSION = 1.0;

            var adsId = (ADS_CONVERSION_APPEL || ADS_CONVERSION_FORMULAIRE).split('/')[0];
            if (adsId) {
                var g = document.createElement('script');
                g.async = true;
                g.src = 'https://www.googletagmanager.com/gtag/js?id=' + adsId;
                document.head.appendChild(g);
                gtag('js', new Date());
                gtag('config', adsId);
            }

            function emplacement(el) {
                if (el.getAttribute('data-emplacement')) return el.getAttribute('data-emplacement');
                if (el.closest('header')) return 'header';
                if (el.closest('footer')) return 'footer';
                for (var n = el, i = 0; n && n !== document.body && i < 4; n = n.parentElement, i++) {
                    if (getComputedStyle(n).position === 'fixed') return 'bouton_flottant';
                }
                var section = el.closest('section[id]');
                return section ? section.id : 'autre';
            }

            document.addEventListener('click', function (e) {
                var lien = e.target.closest && e.target.closest('a[href^="tel:"]');
                if (!lien) return;
                window.dataLayer.push({
                    event: 'clic_appel',
                    telephone: lien.getAttribute('href').replace(/^tel:/, ''),
                    emplacement: emplacement(lien),
                    texte_bouton: (lien.innerText || '').trim().slice(0, 60)
                });
                if (ADS_CONVERSION_APPEL) {
                    gtag('event', 'conversion', { send_to: ADS_CONVERSION_APPEL, value: VALEUR_CONVERSION, currency: 'EUR' });
                }
            }, true);

            document.addEventListener('submit', function (e) {
                var form = e.target;
                if (!form || form.tagName !== 'FORM') return;
                var type = form.querySelector('[name="type"]');
                window.dataLayer.push({ event: 'envoi_formulaire', service: type ? type.value : '' });
                if (ADS_CONVERSION_FORMULAIRE) {
                    gtag('event', 'conversion', { send_to: ADS_CONVERSION_FORMULAIRE, value: VALEUR_CONVERSION, currency: 'EUR' });
                }
            }, true);
        })();
    </script>

    <style>
        #cookie-banner{position:fixed;left:16px;right:16px;bottom:16px;max-width:480px;z-index:2147483000;background:#fff;color:#0B132B;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 15px 40px rgba(0,0,0,.18);font-family:'Manrope',sans-serif}

    </style>
    <script>
        function updateConsent(status) {
            var etat = status === 'granted' ? 'granted' : 'denied';
            gtag('consent', 'update', {
                'ad_storage': etat,
                'ad_user_data': etat,
                'ad_personalization': etat,
                'analytics_storage': etat
            });
            window.dataLayer.push({ event: 'consentement_mis_a_jour', consentement: etat });
            try { localStorage.setItem('consent_choice', etat); } catch (e) {}
            var b = document.getElementById('cookie-banner');
            if (b) b.remove();
        }
        document.addEventListener('DOMContentLoaded', function () {
            var choix = null;
            try { choix = localStorage.getItem('consent_choice'); } catch (e) {}
            if (choix) return;
            var b = document.createElement('div');
            b.id = 'cookie-banner';
            b.setAttribute('role', 'dialog');
            b.setAttribute('aria-label', 'Consentement aux cookies');
            b.innerHTML = '<p class="cb-titre">Respect de votre vie privée</p>'
                + '<p>NICO &amp; FILS utilise des cookies pour mesurer l\'audience et l\'efficacité de ses annonces. Acceptez-vous ces technologies ?</p>'
                + '<div class="cb-btns"><button type="button" class="cb-refuser">Refuser</button>'
                + '<button type="button" class="cb-accepter">Accepter</button></div>';
            b.querySelector('.cb-refuser').onclick = function () { updateConsent('denied'); };
            b.querySelector('.cb-accepter').onclick = function () { updateConsent('granted'); };
            document.body.appendChild(b);
        });
    </script>
